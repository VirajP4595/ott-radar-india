name = "ott-radar-india"
main = "src/worker.js"
compatibility_date = "2025-11-01"

# The site itself: files in ./public are served directly (with the _headers rules).
# Requests that match no file (for example /api/*) go to src/worker.js.
[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "ott-radar-india"
database_id = "26346838-24be-4962-819a-efe73094536e"

# Daily sync of extra release sources at 06:00 IST (00:30 UTC).
[triggers]
crons = ["30 0 * * *"]

[observability]
enabled = true
